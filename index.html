<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glowing-lamp</title>
    <style>
        :root {
            --bg-main: #FAF7F2;      /* Nền kem ngà chính */
            --bg-sub: #F3EDE2;       /* Nền kem đậm hơn cho thẻ phụ / nút */
            --bg-card: #FFFDF9;      /* Nền trắng kem sáng cho thẻ game */
            --text-primary: #2C2523; /* Chữ nâu than đậm sắc nét */
            --text-secondary: #5C5346; /* Chữ nâu ấm trung tính */
            --border-paper: #E5DEC9; /* Viền giấy nhẹ nhàng */
            --accent: #B45309;       /* Màu nhấn hổ phách trầm ấm */
            --accent-hover: #92400E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 3rem 1.5rem;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-paper);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .game-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-paper);
            border-radius: 12px;
            padding: 1.75rem;
            box-shadow: 0 2px 8px rgba(44, 37, 35, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(44, 37, 35, 0.08);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px dashed var(--border-paper);
        }

        .game-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: capitalize;
        }

        .version-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background-color: var(--bg-sub);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .version-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .version-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: var(--bg-sub);
            color: var(--text-primary);
            border: 1px solid var(--border-paper);
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .version-btn:hover {
            background-color: var(--accent);
            color: #FFFDF9;
            border-color: var(--accent);
        }

        .version-btn::before {
            content: "▶";
            font-size: 0.7rem;
            opacity: 0.75;
        }

        .status-box {
            text-align: center;
            padding: 3rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border-paper);
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .error-text {
            color: #B91C1C;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>glowing-lamp</h1>
            <p>Tổng hợp các phiên bản</p>
        </header>

        <main id="game-container" class="game-grid">
            <div class="status-box">Đang quét danh sách thư mục và phiên bản...</div>
        </main>
    </div>

    <script>
        // --- CẤU HÌNH REPOSITORY CỦA BẠN ---
        const GITHUB_USER = "ducnm86"; // Thay bằng username GitHub của bạn
        const GITHUB_REPO = "glowing-lamp";     // Thay bằng tên repo của bạn
        const BRANCH = "main";               // Nhánh mặc định (main hoặc master)

        async function loadGames() {
            const container = document.getElementById('game-container');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`);
                
                if (!response.ok) {
                    throw new Error("Không thể kết nối tới GitHub API (Kiểm tra lại tên User/Repo hoặc chế độ Public).");
                }

                const data = await response.json();

                // Lọc tất cả các file .html nằm trong thư mục con (bỏ qua file index.html ở thư mục gốc)
                const gameFiles = data.tree.filter(item => 
                    item.type === "blob" && 
                    item.path.endsWith(".html") && 
                    item.path.includes("/")
                );

                if (gameFiles.length === 0) {
                    container.innerHTML = '<div class="status-box">Chưa có thư mục game nào chứa file .html</div>';
                    return;
                }

                // Gom nhóm các file theo tên thư mục cha (ví dụ: game1/abc1.html -> nhóm vào "game1")
                const groupedGames = {};

                gameFiles.forEach(file => {
                    const parts = file.path.split('/');
                    const folderName = parts[0]; // Tên thư mục chứa game
                    const fileName = parts[parts.length - 1].replace('.html', ''); // Tên file bỏ đuôi .html

                    if (!groupedGames[folderName]) {
                        groupedGames[folderName] = [];
                    }

                    groupedGames[folderName].push({
                        label: fileName,
                        path: file.path
                    });
                });

                // Render giao diện
                container.innerHTML = '';

                for (const [folderName, versions] of Object.entries(groupedGames)) {
                    // Format tên thư mục cho đẹp (ví dụ: "game-ran-san-moi" -> "game ran san moi")
                    const displayTitle = folderName.replace(/[-_]/g, ' ');

                    const buttonsHtml = versions.map(v => 
                        `<a class="version-btn" href="${v.path}" target="_blank">${v.label}</a>`
                    ).join('');

                    const cardHtml = `
                        <article class="game-card">
                            <div class="game-header">
                                <h2 class="game-title">${displayTitle}</h2>
                                <span class="version-count">${versions.length} phiên bản</span>
                            </div>
                            <div class="version-list">
                                ${buttonsHtml}
                            </div>
                        </article>
                    `;

                    container.innerHTML += cardHtml;
                }

            } catch (error) {
                container.innerHTML = `<div class="status-box"><p class="error-text">Lỗi: ${error.message}</p></div>`;
            }
        }

        loadGames();
    </script>

</body>
</html>
