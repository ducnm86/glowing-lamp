<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F2">
    <meta name="description" content="glowing-lamp: nhật ký học tập chứng chỉ và concept, mỗi bài học là một ngọn đèn nhỏ.">
    <title>glowing-lamp</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E💡%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-main: #FAF7F2;
            --bg-sub: #F3EDE2;
            --bg-card: #FFFDF9;
            --text-primary: #2C2523;
            --text-secondary: #5C5346;
            --border-paper: #E5DEC9;
            --accent: #B45309;
            --accent-hover: #92400E;
            /* sắc nhạt pha từ màu hổ phách cũ */
            --amber-soft: #F9E9CF;
            --amber-mid: #F4D6A8;
            --light: 255, 208, 140;
            --radius: 18px;

            --lamp: clamp(92px, 14vw, 140px);
            --lamp-left: clamp(.5rem, 2.5vw, 2.5rem);
            --pad: clamp(1rem, 4vw, 2rem);
            --on: 1;
        }

        body.off { --on: 0; }

        /* Ban đêm: nền tối đi một chút (vẫn là tông kem ấm) */
        body.night {
            --bg-main: #EEE7DA;
            --bg-sub: #E6DECF;
            --bg-card: #F9F4EA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color .8s ease;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        /* Một trang liền mạch: mọi thứ nằm trên cùng một nền */
        .page {
            position: relative;
            min-height: 100vh;
            overflow-x: clip;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 var(--pad);
        }

        .content { position: relative; z-index: 1; }

        /* ================= ĐÈN BÀN (góc trái trên) ================= */
        .lamp-btn {
            position: absolute;
            z-index: 3;
            top: .5rem;
            left: var(--lamp-left);
            width: var(--lamp);
            height: var(--lamp);
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .lamp-btn svg { display: block; width: 100%; height: 100%; overflow: visible; }

        .lamp-metal { stroke: #ECE4D4; fill: none; stroke-width: 5; stroke-linecap: round; }
        .lamp-joint { fill: #ECE4D4; }
        .lamp-base { fill: #ECE4D4; }
        .lamp-shade { fill: #FAEBD2; }
        .lamp-shade-in { fill: #FFF7EA; }
        .lamp-bulb { fill: #FFE7B0; transition: fill .6s ease; }
        .lamp-halo { fill: rgb(var(--light)); opacity: .30; transition: opacity .6s ease; animation: halo 4.5s ease-in-out infinite; }

        @keyframes halo {
            0%, 100% { transform: scale(1); }
            45% { transform: scale(1.14); }
            60% { transform: scale(.97); }
        }

        .lamp-halo { transform-box: fill-box; transform-origin: center; }

        body.off .lamp-halo { opacity: 0; animation: none; }
        body.off .lamp-bulb { fill: #E9DEC6; }

        .tip {
            position: absolute;
            top: calc(100% + .35rem);
            left: 0;
            z-index: 5;
            padding: .35rem .8rem;
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(44, 37, 35, .10);
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }

        @media (hover: hover) {
            .lamp-btn:hover .tip { opacity: 1; transform: none; }
        }
        .lamp-btn:focus-visible .tip { opacity: 1; transform: none; }

        /* ================= CHÙM SÁNG chiếu chéo xuống góc phải ================= */
        .light {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .beam-motes {
            position: absolute;
            left: var(--ox, 0px);
            top: calc(var(--oy, 0px) - var(--h, 0px) / 2);
            width: var(--len, 0px);
            height: var(--h, 0px);
            transform-origin: 0 50%;
            transform: rotate(var(--ang, 40deg));
            transition: opacity .8s ease;
        }

        .beam {
            position: absolute;
            inset: 0;
            transition: opacity .8s ease;
            animation: flicker 6s ease-in-out infinite;
        }

        .beam-shape, .beam-core { position: absolute; inset: 0; }

        /* quầng rộng ±60° quanh trục đèn (phủ cả góc trái dưới): nhạt, tắt dần theo khoảng cách */
        .beam-shape {
            background: radial-gradient(circle at var(--ox, 0px) var(--oy, 0px),
                rgba(var(--light), .20) 0,
                rgba(var(--light), .13) 18%,
                rgba(var(--light), .07) 45%,
                rgba(var(--light), .03) 72%,
                rgba(var(--light), 0) var(--len, 1px));
            -webkit-mask-image: conic-gradient(from calc(var(--ang, 40deg) + 5deg) at var(--ox, 0px) var(--oy, 0px),
                transparent 0deg, #000 55deg, #000 115deg, transparent 170deg, transparent 360deg);
            mask-image: conic-gradient(from calc(var(--ang, 40deg) + 5deg) at var(--ox, 0px) var(--oy, 0px),
                transparent 0deg, #000 55deg, #000 115deg, transparent 170deg, transparent 360deg);
        }

        /* lõi sáng: hẹp hơn, dịu, tắt nhanh hơn */
        .beam-core {
            background: radial-gradient(circle at var(--ox, 0px) var(--oy, 0px),
                rgba(255, 236, 190, .22) 0,
                rgba(var(--light), .10) 20%,
                rgba(var(--light), 0) calc(var(--len, 1px) * .6));
            -webkit-mask-image: conic-gradient(from calc(var(--ang, 40deg) + 30deg) at var(--ox, 0px) var(--oy, 0px),
                transparent 0deg, #000 38deg, #000 82deg, transparent 120deg, transparent 360deg);
            mask-image: conic-gradient(from calc(var(--ang, 40deg) + 30deg) at var(--ox, 0px) var(--oy, 0px),
                transparent 0deg, #000 38deg, #000 82deg, transparent 120deg, transparent 360deg);
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            47% { opacity: .95; }
            50% { opacity: .82; }
            53% { opacity: .98; }
        }

        .beam-motes { clip-path: polygon(0 47%, 100% 0, 100% 100%, 0 53%); }

        .mote {
            position: absolute;
            left: var(--l);
            top: var(--t);
            width: var(--s);
            height: var(--s);
            border-radius: 50%;
            background: rgb(255, 224, 160);
            opacity: 0;
            animation: drift var(--dur) ease-in-out var(--del) infinite;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: .9; }
            85% { opacity: .35; }
            100% { transform: translate(var(--x), var(--y)); opacity: 0; }
        }

        body.off .beam, body.off .beam-motes { opacity: 0; }
        body.off .beam { animation: none; }

        /* ================= Hero ================= */
        .hero {
            text-align: left;
            padding-top: calc(var(--lamp) + 1.25rem);
            padding-bottom: 1.75rem;
        }

        .greet {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .9rem;
            padding: .3rem .9rem;
            font-size: .85rem;
            font-weight: 600;
            color: var(--accent-hover);
            background: var(--amber-soft);
            border-radius: 999px;
        }

        .hero h1 {
            font-size: clamp(2.1rem, 7vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.1;
            margin-bottom: .6rem;
        }

        .hero p {
            max-width: 32rem;
            color: var(--text-secondary);
            font-size: clamp(.95rem, 2.6vw, 1.1rem);
        }

        /* Màn hình rộng: tiêu đề nằm cạnh đèn, không đè lên nhau */
        @media (min-width: 720px) {
            .hero {
                padding-top: 3.25rem;
                padding-left: max(0px, calc(var(--lamp-left) + var(--lamp) + 1.5rem - max(0px, (100vw - 1040px) / 2) - var(--pad)));
            }
        }

        /* ================= Danh sách ================= */
        main { padding: 1.25rem 0 3rem; }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr));
            gap: 1.4rem;
            list-style: none;
        }

        /* Cuốn vở: càng gần đèn (và nằm trong chùm sáng) càng sáng ấm */
        .note {
            --tilt: -.7deg;
            --lit: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            padding: 1.35rem 1.3rem 1.4rem 1.6rem;
            background-color: color-mix(in srgb, var(--amber-soft) calc(var(--lit) * var(--on) * 60%), var(--bg-card));
            border-radius: 6px var(--radius) var(--radius) 6px;
            box-shadow:
                0 2px 14px rgba(44, 37, 35, .05),
                0 0 calc(var(--lit) * var(--on) * 40px) rgba(var(--light), calc(var(--lit) * var(--on) * .32));
            transform: rotate(var(--tilt));
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .7s ease, background-color .7s ease;
        }

        .note:nth-child(3n+2) { --tilt: .6deg; }
        .note:nth-child(3n+3) { --tilt: -.25deg; }

        .note::before {
            content: "";
            position: absolute;
            left: 0; top: 14px; bottom: 14px;
            width: 8px;
            border-radius: 0 8px 8px 0;
            background: var(--amber-mid);
            transition: top .3s, bottom .3s;
        }

        .note:nth-child(3n+2)::before { background: var(--amber-soft); }
        .note:nth-child(3n+3)::before { background: #EFE0C4; }

        .note:not(.in) { opacity: 0; }
        .note.in { animation: place .7s cubic-bezier(.2, .9, .3, 1) var(--d, 0ms) backwards; }

        @keyframes place {
            from { opacity: 0; transform: translateY(26px) rotate(calc(var(--tilt) * 4)) scale(.96); }
        }

        @media (hover: hover) {
            .note:hover {
                transform: translateY(-6px) rotate(0deg);
                box-shadow:
                    0 18px 34px rgba(var(--light), .42),
                    0 0 calc(var(--lit) * var(--on) * 40px) rgba(var(--light), calc(var(--lit) * var(--on) * .32));
            }
            .note:hover::before { top: 8px; bottom: 8px; }
        }

        .note-head { display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; }

        .note-no {
            padding: .1rem .65rem;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent-hover);
            background: var(--amber-soft);
            border-radius: 999px;
        }

        .note-title {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.01em;
            text-transform: capitalize;
            overflow-wrap: anywhere;
        }

        .note-meta { font-size: .85rem; color: var(--text-secondary); }

        .version-list { display: flex; flex-wrap: wrap; gap: .5rem; }

        .version-btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            min-height: 44px; /* vùng chạm tối thiểu trên mobile */
            padding: .5rem 1.05rem;
            background: var(--bg-sub);
            color: var(--text-primary);
            border-radius: 999px;
            text-decoration: none;
            font-size: .95rem;
            font-weight: 500;
            overflow-wrap: anywhere;
            transition: background-color .25s, color .25s, transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .25s;
        }

        .version-btn::before {
            content: "";
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--amber-mid);
            transition: background-color .25s, box-shadow .25s;
        }

        .version-btn:hover, .version-btn:focus-visible {
            background: var(--amber-mid);
            color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(var(--light), .55);
        }

        .version-btn:hover::before, .version-btn:focus-visible::before {
            background: var(--accent);
            box-shadow: 0 0 8px 2px rgba(var(--light), .9);
        }

        .version-btn:active { transform: scale(.96); }

        /* ================= Trạng thái ================= */
        .status-box {
            text-align: center;
            padding: 3rem 1.25rem;
            background: var(--bg-card);
            border-radius: var(--radius);
            color: var(--text-secondary);
        }

        .status-box .icon { font-size: 2.2rem; margin-bottom: .5rem; }
        .status-box h2 { font-size: 1.1rem; color: var(--text-primary); margin-bottom: .35rem; }
        .error-text { color: #B91C1C !important; }

        .retry-btn {
            margin-top: 1rem;
            min-height: 46px;
            padding: .55rem 1.6rem;
            font: inherit;
            font-weight: 600;
            color: var(--accent-hover);
            background: var(--amber-mid);
            border: 0;
            border-radius: 999px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(var(--light), .55); }

        .skeleton {
            height: 170px;
            border-radius: 6px var(--radius) var(--radius) 6px;
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--amber-soft) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite linear;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
        }

        @media (max-width: 480px) {
            .note { padding: 1.2rem 1.05rem 1.25rem 1.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
            .note:not(.in) { opacity: 1; }
            .beam-motes { display: none; }
        }
    </style>
</head>
<body>
<script>(function(){var h=(new Date().getUTCHours()+7)%24,n=h>=18||h<6,c=document.body.classList;if(n)c.add("night");else c.add("off");})();</script>

<div class="page" id="page">

    <!-- Ánh sáng: nằm sau nội dung, chiếu chéo từ đèn xuống góc phải dưới -->
    <div class="light" id="light" aria-hidden="true">
        <div class="beam"><div class="beam-shape"></div><div class="beam-core"></div></div>
        <div class="beam-motes" id="motes"></div>
    </div>

    <button class="lamp-btn" id="lamp" type="button" aria-pressed="true" aria-label="Bật hoặc tắt đèn bàn" aria-describedby="lampTip">
        <svg id="lampSvg" viewBox="0 0 150 150" aria-hidden="true">
            <rect class="lamp-base" x="12" y="134" width="62" height="10" rx="5"/>
            <path class="lamp-metal" d="M42 134 L58 80"/>
            <path class="lamp-metal" d="M58 80 L92 40"/>
            <circle class="lamp-joint" cx="58" cy="80" r="6"/>
            <g id="head" transform="translate(92 40) rotate(40)">
                <circle class="lamp-halo" cx="14" cy="0" r="22"/>
                <path class="lamp-shade" d="M-16 -8 L8 -19 Q12 -19 12 -15 L12 15 Q12 19 8 19 L-16 8 Z"/>
                <ellipse class="lamp-shade-in" cx="12" cy="0" rx="4" ry="16"/>
                <circle class="lamp-bulb" id="bulb" cx="14" cy="0" r="6.5"/>
            </g>
            <circle class="lamp-joint" cx="92" cy="40" r="5"/>
        </svg>
        <span class="tip" id="lampTip" role="tooltip">Chạm để tắt đèn</span>
    </button>

    <div class="content">

        <header class="container hero">
            <span class="greet" id="greet">🌙 Bật đèn, học thôi</span>
            <h1>glowing-lamp</h1>
            <p>A little light for every lesson learned, every milestone earned</p>
        </header>

        <main class="container">
            <div id="game-container" aria-busy="true">
                <ul class="game-grid" aria-label="Đang tải">
                    <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
                </ul>
            </div>
        </main>

    </div>
</div>

    <script>
        // --- CẤU HÌNH REPOSITORY ---
        const GITHUB_USER = "ducnm86";
        const GITHUB_REPO = "glowing-lamp";
        const BRANCH = "main";

        const CACHE_KEY = `gl:${GITHUB_USER}/${GITHUB_REPO}@${BRANCH}`;
        const CACHE_TTL = 10 * 60 * 1000; // 10 phút, tránh chạm giới hạn 60 request/giờ của GitHub API

        const container = document.getElementById('game-container');
        const page = document.getElementById('page');
        const light = document.getElementById('light');
        const lampSvg = document.getElementById('lampSvg');
        const head = document.getElementById('head');
        const bulb = document.getElementById('bulb');
        let allGames = [];
        let beam = { ox: 0, oy: 0, a: 0.7, len: 1 };

        const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const encodePath = p => p.split('/').map(encodeURIComponent).join('/');
        const collator = new Intl.Collator('vi', { numeric: true, sensitivity: 'base' });
        const pad = n => String(n).padStart(2, '0');

        /* ---------- Đèn: bật / tắt ---------- */
        const lamp = document.getElementById('lamp');
        const lampTip = document.getElementById('lampTip');
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        function syncLamp() {
            const on = !document.body.classList.contains('off');
            lamp.setAttribute('aria-pressed', String(on));
            lampTip.textContent = on ? 'Chạm để tắt đèn' : 'Chạm để bật đèn';
        }

        lamp.addEventListener('click', () => {
            document.body.classList.toggle('off');
            syncLamp();
        });

        /* Ngày (6h–18h): nền sáng, đèn tắt. Đêm: nền tối nhẹ, tự bật đèn. */
        let isNight = null;
        function applyDayNight() {
            const h = (new Date().getUTCHours() + 7) % 24; // GMT+7
            const night = h >= 18 || h < 6;
            if (night === isNight) return;
            isNight = night;
            document.body.classList.toggle('night', night);
            document.body.classList.toggle('off', !night);
            themeMeta.setAttribute('content', night ? '#EEE7DA' : '#FAF7F2');
            syncLamp();
        }
        applyDayNight();
        setInterval(applyDayNight, 60000);

        /* ---------- Lời chào theo giờ ---------- */
        function updateGreeting() {
            const d = new Date();
            const h = (d.getUTCHours() + 7) % 24; // GMT+7
            const msg = h < 5 ? '🌙 Khuya rồi, nhớ nghỉ ngơi'
                      : h < 11 ? '☀️ Chào buổi sáng'
                      : h < 14 ? '🍵 Buổi trưa dịu nhẹ'
                      : h < 18 ? '🌤️ Buổi chiều học tập'
                      : '🌙 Bàn học buổi tối';
            document.getElementById('greet').textContent = `${msg} · ${pad(h)}:${pad(d.getUTCMinutes())}`;
        }
        updateGreeting();
        setInterval(updateGreeting, 30000);

        /* ---------- Hạt bụi bay dọc theo chùm sáng ---------- */
        (function makeMotes() {
            const box = document.getElementById('motes');
            for (let i = 0; i < 22; i++) {
                const m = document.createElement('span');
                m.className = 'mote';
                m.style.cssText =
                    `--l:${(Math.random() * 45).toFixed(1)}%;` +
                    `--t:${(35 + Math.random() * 30).toFixed(1)}%;` +
                    `--s:${(2 + Math.random() * 3).toFixed(1)}px;` +
                    `--dur:${(8 + Math.random() * 8).toFixed(1)}s;` +
                    `--del:${(-Math.random() * 14).toFixed(1)}s;` +
                    `--x:${Math.round(120 + Math.random() * 320)}px;` +
                    `--y:${Math.round((Math.random() * 2 - 1) * 30)}px`;
                box.appendChild(m);
            }
        })();

        /* ---------- Hình học của chùm sáng ---------- */
        function layout() {
            const pr = page.getBoundingClientRect();
            const sr = lampSvg.getBoundingClientRect();
            const s = sr.width / 150;

            // điểm xoay của đầu đèn, tính theo toạ độ trang
            const px = sr.left - pr.left + 92 * s;
            const py = sr.top - pr.top + 40 * s;

            // đích: góc phải dưới của màn hình đầu tiên
            const tx = pr.width * 0.92;
            const ty = Math.min(Math.max(innerHeight * 0.9, 520), 950);

            let a = Math.atan2(ty - py, tx - px) * 180 / Math.PI;
            a = Math.min(66, Math.max(28, a));
            head.setAttribute('transform', `translate(92 40) rotate(${a.toFixed(1)})`);

            // vị trí bóng đèn sau khi xoay đầu đèn = gốc của chùm sáng
            const br = bulb.getBoundingClientRect();
            const ox = br.left + br.width / 2 - pr.left;
            const oy = br.top + br.height / 2 - pr.top;
            const len = Math.hypot(tx - ox, ty - oy) * 1.45;

            light.style.setProperty('--ox', ox.toFixed(1) + 'px');
            light.style.setProperty('--oy', oy.toFixed(1) + 'px');
            light.style.setProperty('--len', len.toFixed(1) + 'px');
            light.style.setProperty('--h', (len * 0.95).toFixed(1) + 'px');
            light.style.setProperty('--ang', a.toFixed(2) + 'deg');

            beam = { ox, oy, a: a * Math.PI / 180, len };
            lightNotes();
        }

        /* Độ sáng của mỗi cuốn vở: gần đèn + nằm trong tia sáng = đậm; xa = nhạt */
        function lightNotes() {
            const pr = page.getBoundingClientRect();
            const dx = Math.cos(beam.a), dy = Math.sin(beam.a);

            container.querySelectorAll('.note').forEach(n => {
                const r = n.getBoundingClientRect();
                const cx = r.left + r.width / 2 - pr.left - beam.ox;
                const cy = r.top + r.height / 2 - pr.top - beam.oy;
                const along = cx * dx + cy * dy;
                const perp = Math.abs(-cx * dy + cy * dx);
                let lit = 0;
                const dist = Math.hypot(cx, cy);
                let th = Math.atan2(cy, cx) - beam.a;
                th = Math.atan2(Math.sin(th), Math.cos(th));
                const t = Math.abs(th) / (85 * Math.PI / 180);
                if (t < 1 && dist < beam.len) lit = (1 - t * t) * Math.pow(1 - dist / beam.len, 1.05);
                n.style.setProperty('--lit', lit.toFixed(3));
            });
        }

        let raf = 0;
        const scheduleLayout = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); };
        addEventListener('resize', scheduleLayout);
        addEventListener('load', scheduleLayout);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleLayout);
        layout();

        /* ---------- Hiện dần khi cuộn tới ---------- */
        const io = 'IntersectionObserver' in window
            ? new IntersectionObserver(entries => entries.forEach(en => {
                if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
            }), { threshold: .12 })
            : null;

        function reveal() {
            container.querySelectorAll('.note').forEach(n => io ? io.observe(n) : n.classList.add('in'));
        }

        /* ---------- Dữ liệu từ GitHub ---------- */
        function readCache() {
            try {
                const raw = sessionStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const { t, d } = JSON.parse(raw);
                return Date.now() - t < CACHE_TTL ? d : null;
            } catch { return null; }
        }

        function writeCache(d) {
            try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d })); } catch {}
        }

        async function fetchTree() {
            const cached = readCache();
            if (cached) return cached;

            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`);
            if (res.status === 403) throw new Error("GitHub tạm giới hạn số lượt truy cập. Vui lòng thử lại sau ít phút.");
            if (!res.ok) throw new Error("Không thể kết nối tới GitHub API (kiểm tra tên User/Repo, nhánh hoặc chế độ Public).");

            const data = await res.json();
            writeCache(data);
            return data;
        }

        function groupGames(data) {
            const files = data.tree.filter(i => i.type === "blob" && i.path.endsWith(".html") && i.path.includes("/"));
            const groups = {};

            files.forEach(f => {
                const parts = f.path.split('/');
                const folder = parts[0];
                const label = parts[parts.length - 1].replace(/\.html$/, '');
                (groups[folder] ||= []).push({ label, path: f.path });
            });

            return Object.entries(groups)
                .map(([folder, versions]) => ({
                    folder,
                    title: folder.replace(/[-_]/g, ' '),
                    versions: versions.sort((a, b) => collator.compare(a.label, b.label))
                }))
                .sort((a, b) => collator.compare(a.title, b.title));
        }

        function render(list) {
            container.setAttribute('aria-busy', 'false');

            if (!allGames.length) {
                container.innerHTML = `<div class="status-box"><div class="icon" aria-hidden="true">🪔</div><h2>Chưa có bài học nào</h2><p>Hãy thêm thư mục chứa file .html vào repo để chúng xuất hiện trên bàn học.</p></div>`;
                return;
            }

            if (!list.length) {
                container.innerHTML = `<div class="status-box"><div class="icon" aria-hidden="true">🔍</div><h2>Không tìm thấy kết quả</h2><p>Thử từ khóa khác nhé.</p></div>`;
                return;
            }

            container.innerHTML = `<ul class="game-grid">${list.map((g, i) => `
                <li class="note" style="--d:${Math.min(i, 8) * 70}ms">
                    <div class="note-head">
                        <span class="note-no">Quyển ${pad(allGames.indexOf(g) + 1)}</span>
                        <h2 class="note-title">${esc(g.title)}</h2>
                        <span class="note-meta">${g.versions.length} phiên bản</span>
                    </div>
                    <div class="version-list">
                        ${g.versions.map(v => `<a class="version-btn" href="${encodePath(v.path)}" target="_blank" rel="noopener">${esc(v.label)}</a>`).join('')}
                    </div>
                </li>`).join('')}</ul>`;


            reveal();
            lightNotes();
            scheduleLayout();
        }

        function showError(msg) {
            container.setAttribute('aria-busy', 'false');
            container.innerHTML = `<div class="status-box" role="alert"><div class="icon" aria-hidden="true">⚠️</div><h2 class="error-text">Đã xảy ra lỗi</h2><p>${esc(msg)}</p><button class="retry-btn" type="button" id="retry">Thử lại</button></div>`;
            document.getElementById('retry').addEventListener('click', () => { try { sessionStorage.removeItem(CACHE_KEY); } catch {} loadGames(); });
        }

        async function loadGames() {
            container.setAttribute('aria-busy', 'true');
            container.innerHTML = `<ul class="game-grid"><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li></ul>`;
            try {
                allGames = groupGames(await fetchTree());
                render(allGames);
            } catch (e) {
                showError(e.message || "Lỗi không xác định.");
            }
        }

        loadGames();
    </script>

</body>
